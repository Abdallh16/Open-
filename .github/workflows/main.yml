name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          if [ -f nexus2-ai.zip ]; then
            ARCHIVE="nexus2-ai.zip"
          elif [ -f untitled.zip ]; then
            ARCHIVE="untitled.zip"
          elif [ -f nexus-ai.zip ]; then
            ARCHIVE="nexus-ai.zip"
          elif [ -f zip.zip ]; then
            ARCHIVE="zip.zip"
          else
            echo "ERROR: No project ZIP found (expected nexus2-ai.zip, untitled.zip, nexus-ai.zip, or zip.zip)"
            exit 1
          fi
          echo "Using archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "=== Android Gradle Plugin / Kotlin versions ==="
          grep -R -n -E 'com.android.application|com.android.library|org.jetbrains.kotlin.android|kotlin =|agp =' project/settings.gradle.kts project/build.gradle.kts project/gradle/libs.versions.toml project/app/build.gradle.kts 2>/dev/null || true

      - name: Wire Nexus launcher and real app entry point
        shell: bash
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import xml.etree.ElementTree as ET

          root = Path("project/app/src/main")
          java = root / "java/com/example/MainActivity.kt"
          java.write_text("""package com.example

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.example.ui.NexusApp
          import com.example.ui.theme.MyApplicationTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      MyApplicationTheme {
                          NexusApp()
                      }
                  }
              }
          }
          """.replace("          ", ""), encoding="utf-8")

          icon = root / "res/drawable/nexus_ai_icon_1793368542737.jpg"
          if not icon.exists():
              raise SystemExit(f"Expected Nexus logo image missing: {icon}")

          # Android 8+ adaptive icon: use the actual exported Nexus logo,
          # not the default Android Studio robot foreground.
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              p = root / f"res/mipmap-anydpi-v26/{name}"
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/nexus_ai_icon_1793368542737" />
          </adaptive-icon>
          ''', encoding="utf-8")

          bg = root / "res/drawable/ic_launcher_background.xml"
          bg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101426" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          ''', encoding="utf-8")

          # Legacy launcher bitmaps for older launchers / OEM fallback.
          with Image.open(icon) as source:
              source = ImageOps.fit(source.convert("RGBA"), (432, 432), method=Image.Resampling.LANCZOS)
              for density, size in {
                  "mdpi": 48, "hdpi": 72, "xhdpi": 96,
                  "xxhdpi": 144, "xxxhdpi": 192
              }.items():
                  folder = root / f"res/mipmap-{density}"
                  folder.mkdir(parents=True, exist_ok=True)
                  rendered = source.resize((size, size), Image.Resampling.LANCZOS)
                  rendered.save(folder / "ic_launcher.png", optimize=True)
                  rendered.save(folder / "ic_launcher_round.png", optimize=True)

          print("Launcher icon now references exported Nexus JPG at adaptive and legacy densities.")
          print("MainActivity now launches com.example.ui.NexusApp inside MyApplicationTheme.")
          PY

      - name: Inspect exported app contents
        run: |
          echo "=== Kotlin source files ==="
          find project/app/src/main/java -type f -name '*.kt' -print
          echo "=== App manifest ==="
          while IFS= read -r manifest; do
            echo "--- $manifest ---"
            sed -n '1,220p' "$manifest"
          done < <(find project/app/src/main -name AndroidManifest.xml -print)
          echo "=== MainActivity source ==="
          sed -n '1,240p' project/app/src/main/java/com/example/MainActivity.kt
          echo "=== NexusApp navigation source ==="
          sed -n '1,220p' project/app/src/main/java/com/example/ui/NexusApp.kt
          echo "=== Launcher icon adaptive resources ==="
          for f in project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml project/app/src/main/res/drawable/ic_launcher_foreground.xml project/app/src/main/res/drawable/ic_launcher_background.xml; do
            echo "--- $f ---"
            sed -n '1,180p' "$f"
          done
          echo "=== Kotlin entry points and screen titles ==="
          grep -R -n -E 'class MainActivity|fun MainActivity|setContent|Hello Android|مرحبا|NavHost|@Composable|applicationId|app_name' project/app/src/main/java project/app/src/main/res 2>/dev/null | head -240 || true
          echo "=== Resources ==="
          find project/app/src/main/res -maxdepth 3 -type f | sort | head -200

      - name: Repair missing app dependencies and theme imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project")
          gradle = root / "app/build.gradle.kts"
          text = gradle.read_text()
          if "androidx.navigation:navigation-compose" not in text:
              dep = '    implementation("androidx.navigation:navigation-compose:2.9.6")'
              match = re.search(r"dependencies\s*\{", text)
              if not match:
                  raise SystemExit("Could not find dependencies block in app/build.gradle.kts")
              pos = match.end()
              text = text[:pos] + "\n" + dep + text[pos:]
              gradle.write_text(text)
              print("Added Navigation Compose dependency")

          names = [
              "CyanAccent", "ElectricBlue", "PurplePrimary", "PurpleDeep", "PurpleGlow",
              "TextPrimary", "TextSecondary", "TextMuted", "CharcoalBorder",
              "CharcoalSurfaceVariant", "CharcoalSurface", "CharcoalDark",
              "ErrorRed", "SuccessGreen", "WarningAmber"
          ]
          kotlin_files = list((root / "app/src/main/java").rglob("*.kt"))
          defs = {}
          for f in kotlin_files:
              source = f.read_text(errors="ignore")
              pkg = re.search(r"^\s*package\s+([\w.]+)", source, re.M)
              if not pkg:
                  continue
              for name in names:
                  if re.search(r"\b(?:val|var|const\s+val)\s+" + re.escape(name) + r"\b", source):
                      defs[name] = pkg.group(1)

          theme_pkg = next((p for p in defs.values() if p.endswith(".theme")), "com.example.ui.theme")
          missing = [n for n in names if n not in defs]
          if missing:
              palette_dir = root / "app/src/main/java" / Path(*theme_pkg.split("."))
              palette_dir.mkdir(parents=True, exist_ok=True)
              palette = palette_dir / "BuildPalette.kt"
              colors = {
                  "CyanAccent": "0xFF00E5FF",
                  "ElectricBlue": "0xFF2979FF",
                  "PurplePrimary": "0xFF7C4DFF",
                  "PurpleDeep": "0xFF311B92",
                  "PurpleGlow": "0xFFB388FF",
                  "TextPrimary": "0xFFF5F5F5",
                  "TextSecondary": "0xFFB0BEC5",
                  "TextMuted": "0xFF78909C",
                  "CharcoalBorder": "0xFF37474F",
                  "CharcoalSurfaceVariant": "0xFF263238",
                  "CharcoalSurface": "0xFF1C2429",
                  "CharcoalDark": "0xFF101418",
                  "ErrorRed": "0xFFCF6679",
                  "SuccessGreen": "0xFF69F0AE",
                  "WarningAmber": "0xFFFFD740",
              }
              palette.write_text(
                  "package " + theme_pkg + "\n\nimport androidx.compose.ui.graphics.Color\n\n" +
                  "".join(f"val {name} = Color(0x{value[2:]})\n" for name, value in colors.items() if name in missing)
              )
              print("Created fallback palette in", theme_pkg, "for", missing)

          # Ensure files using palette symbols can resolve them, even when they
          # already have individual imports from the same theme package.
          for f in kotlin_files:
              source = f.read_text(errors="ignore")
              if not any(re.search(r"\b" + re.escape(n) + r"\b", source) for n in names):
                  continue
              if re.search(r"^\s*import\s+" + re.escape(theme_pkg) + r"\.\*\s*$", source, re.M):
                  continue
              m = re.search(r"^\s*package\s+[\w.]+\s*\n", source, re.M)
              if m:
                  source = source[:m.end()] + f"\nimport {theme_pkg}.*\n" + source[m.end():]
                  f.write_text(source)
          PY

      - name: Ensure example environment file exists
        run: |
          # The Google Maps secrets plugin fails configuration if this optional template is absent.
          # Keep any exported file intact; create an empty template only when the ZIP omitted it.
          if [ ! -f project/.env.example ]; then
            touch project/.env.example
            echo "Created empty project/.env.example for Gradle configuration."
          fi

      - name: Provide Android auth redirect scheme placeholder
        working-directory: project
        run: |
          if ! grep -q 'appAuthRedirectScheme' app/build.gradle.kts; then
            cat >> app/build.gradle.kts <<'EOF'

          android {
              defaultConfig {
                  manifestPlaceholders["appAuthRedirectScheme"] = "nexusai"
              }
          }
          EOF
            echo "Added appAuthRedirectScheme manifest placeholder: nexusai"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug signing keystore
        working-directory: project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-AI-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
