name: Build Nova

on:
  workflow_dispatch:
  push:
    paths:
      - 'nova (1).zip'
      - '.github/workflows/nova-build.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect Nova archive
        run: |
          set -e
          test -s 'nova (1).zip'
          echo "=== Archive file ==="
          file 'nova (1).zip'
          echo "=== Archive listing ==="
          unzip -l 'nova (1).zip' | head -250
          echo "=== Root entries ==="
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("nova (1).zip")
          names=z.namelist()
          roots=sorted({n.split("/")[0] for n in names if n})
          print("\\n".join(roots))
          print("TOTAL_ENTRIES",len(names))
          print("\\n=== Embedded Nova build workflow ===")
          print(z.read(".github/workflows/build.yml").decode())
          print("\\n=== Root Gradle build ===")
          print(z.read("build.gradle.kts").decode())
          print("\\n=== App Gradle build ===")
          print(z.read("app/build.gradle.kts").decode())
          print("\\n=== Gradle wrapper properties ===")
          print(z.read("gradle/wrapper/gradle-wrapper.properties").decode())
          print("\\n=== Metadata ===")
          print(z.read("metadata.json").decode())
          PY

      - name: Extract Nova Android project
        run: |
          mkdir -p nova-project
          unzip -q 'nova (1).zip' -d nova-project
          test -f nova-project/settings.gradle.kts
          test -f nova-project/app/build.gradle.kts
          test -f nova-project/gradle/libs.versions.toml
          echo "Nova project extracted and Gradle files verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Nova Android SDK platforms
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug signing keystore
        working-directory: nova-project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Nova debug APK
        working-directory: nova-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify Nova APK
        run: |
          APK="nova-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-APK
          path: nova-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Nova build workflow enabled.
